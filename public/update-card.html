<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #fdf2f8 0%, #f0f9ff 50%, #fefce8 100%);
    display: flex; justify-content: center; align-items: center;
    width: 750px; padding: 24px 0; overflow: hidden;
  }
  .card {
    background: #fff;
    border-radius: 18px;
    padding: 28px 40px;
    width: 670px;
    box-shadow: 0 16px 48px rgba(0,0,0,0.06), 0 4px 12px rgba(0,0,0,0.04);
  }
  .header { text-align: center; margin-bottom: 22px; }
  .emoji { font-size: 44px; line-height: 1.2; }
  .title { font-size: 28px; font-weight: 800; color: #1a1a2e; }
  .subtitle { font-size: 14px; color: #94a3b8; margin-top: 2px; }

  .section { margin-bottom: 20px; }
  .section-title { font-size: 20px; font-weight: 700; color: #1e293b; margin-bottom: 6px; }
  .section-body { font-size: 16px; color: #475569; line-height: 1.7; padding-left: 2px; }
  .tag {
    display: inline-block;
    background: linear-gradient(135deg, #fbcfe8, #fde68a);
    color: #b45389;
    font-size: 14px;
    font-weight: 600;
    padding: 1px 9px;
    border-radius: 5px;
    margin-right: 5px;
  }

  .divider { height: 1px; background: #f1f5f9; margin: 20px 0; }

  .footer {
    text-align: center;
    background: #f8fafc;
    border-radius: 12px;
    padding: 18px;
  }
  .url { font-size: 20px; font-weight: 700; color: #0f172a; letter-spacing: -0.3px; }
  .cta { font-size: 14px; color: #64748b; margin-top: 3px; }

  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 7px; vertical-align: middle; }
  .dot.pink { background: #f472b6; }
  .dot.blue { background: #60a5fa; }
  .dot.amber { background: #fbbf24; }
  .dot.green { background: #34d399; }
</style>
</head>
<body>
<div class="card">

  <div class="header">
    <div class="emoji">🧋</div>
    <div class="title">吨吨派对 · 更新日志 v1.1</div>
    <div class="subtitle">2026.05.28</div>
  </div>

  <div class="section">
    <div class="section-title"><span class="dot pink"></span>吨吨日历</div>
    <div class="section-body">
      日记页新增<span class="tag">月视图日历</span>，圆点标记每天几杯，点击展开详情<br>
      个人页新增<span class="tag">迷你日历</span>，一眼看完整月吨吨天数
    </div>
  </div>

  <div class="section">
    <div class="section-title"><span class="dot blue"></span>操作 & 细节</div>
    <div class="section-body">
      <span class="tag">编辑记录</span>吨吨本支持修改已发布的记录<br>
      <span class="tag">超大杯</span>尺寸选项已上线<br>
      <span class="tag">点赞数</span>日记页直接可见<br>
      <span class="tag">Toast 提示</span>新增记录后弹窗确认
    </div>
  </div>

  <div class="section">
    <div class="section-title"><span class="dot amber"></span>品牌上新</div>
    <div class="section-body">
      煲珠公 · 比星咖啡 已加入品牌库
    </div>
  </div>

  <div class="divider"></div>

  <div class="footer">
    <div class="url">milkteaparty.netlify.app</div>
    <div class="cta">打开即用，无需下载 · 奶茶自由记录</div>
  </div>

</div>
<script>
  const card = document.querySelector('.card');
  const rect = card.getBoundingClientRect();
  document.body.style.height = (rect.bottom + 24) + 'px';
</script>
</body>
</html>
